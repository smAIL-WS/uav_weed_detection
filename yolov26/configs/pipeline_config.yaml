# ── Pipeline Configuration ────────────────────────────────────────────────────

project:
  name: "fop_yolo26"
  base_dir: "/local1/yolo26_fop"
  device: 2

dataset:
  root: "/local1/yolo26_fop/data"
  nc: 2
  names: ["crop", "weed"]

  variants:
    - full_dataset
    - half_dataset_v1
    - half_dataset_v2
    - half_dataset_v3
    - quarter_dataset_v1
    - quarter_dataset_v2
    - quarter_dataset_v3
    - single_image_per_growth_stage_v1
    - single_image_per_growth_stage_v2
    - single_image_per_growth_stage_v3
    - pgs_1
    - pgs_2
    - pgs_3
    - pgs_4
    - pgs_5
    - pgs_6

  folds: [fold_1, fold_2, fold_3, fold_4, fold_5]
  retrain_dir: final_retrain_data

model:
  weights: "yolo26l.pt"          # switched from yolo26n to yolo26l

training:
  epochs: 100
  imgsz: 512
  patience: 20
  workers: 0                     # 0 to avoid dataloader deadlock
  verbose: false
  plots: false

optuna:
  n_trials: 30
  direction: "maximize"
  metric: "metrics/mAP50(B)"
  sampler: "TPE"
  seed: 42

  search_space:
    batch:
      type: categorical
      choices: [8, 16, 32]
    weight_decay:
      type: float
      low: 1.0e-5
      high: 1.0e-2
      log: true
    warmup_epochs:
      type: int
      low: 1
      high: 5
    lrf:
      type: float
      low: 0.001
      high: 0.1
      log: true

retrain:
  patience: 20
  val: false

inference:
  window_sizes: [512, 1024]
  stride: 256
  conf: 0.05
  iou: 0.3